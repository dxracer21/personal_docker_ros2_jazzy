joint_trajectory_executor:
  ros__parameters:
    joint_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    step_names: [home]  # Names of the steps

    home: [0.0, -1.3950, 2.3698, -1.0527, 1.5707963267948966, 0.0]  # Initial position

    duration: 10.0
    epsilon: 0.01
    action_topic: '/arm_controller/follow_joint_trajectory'
    joint_states_topic: '/joint_states'

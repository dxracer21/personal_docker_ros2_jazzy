jacobian_tracker:
  ros__parameters:
    target_pose_topic: /omy/target_pose
    joint_states_topic: /joint_states
    command_topic: /arm_controller/joint_trajectory
    base_link: world
    end_effector_link: end_effector_link
    joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
    control_rate: 50.0
    command_duration: 0.08
    position_gain: 2.0
    orientation_gain: 0.35
    damping: 0.08
    max_joint_delta: 0.025
    position_tolerance: 0.01
    orientation_tolerance: 0.08
    target_timeout: 0.5
